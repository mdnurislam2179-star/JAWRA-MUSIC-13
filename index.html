<style>

/* ================= SPLASH ================= */

#splash{
  position:fixed;
  inset:0;
  background:#000;
  z-index:9999999;
  display:flex;
  align-items:center;
  justify-content:center;

}

@keyframes splashPulse{
  from{
    transform:scale(.94);
    opacity:.8;
  }
  to{
    transform:scale(1);
    opacity:1;
  }
}

@keyframes splashOut{
  to{
    opacity:0;

  }

/* ================= STATE ================= */

let currentVideoId = "";

"trending music";

/* ================= API CHECK ================= */

function hasApiKey(){

  return API_KEY &&
         API_KEY !==
         "YOUR_YOUTUBE_API_KEY_HERE";

}


/* ================= ESCAPE HTML ================= */

function escapeHTML(value){

  return String(value || "")
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#039;");

}


/* ================= YOUTUBE SEARCH ================= */

async function youtubeSearch(
  query,
  maxResults=10,
  pageToken=""
){

  if(!hasApiKey()){

    throw new Error(
      "YouTube API key বসানো হয়নি।"
    );

  }

  let url =
    API_URL +
    "?part=snippet" +
    "&type=video" +
    "&maxResults=" +
    maxResults +
    "&q=" +
    encodeURIComponent(query) +
    "&regionCode=BD" +
    "&safeSearch=moderate" +
    "&key=" +
    encodeURIComponent(API_KEY);

  if(pageToken){

    url +=
      "&pageToken=" +
      encodeURIComponent(pageToken);

  }

  const response =
    await fetch(url);

  const data =
    await response.json();

  if(!response.ok){

    throw new Error(
      data?.error?.message ||
      "YouTube API error"
    );

  }

  return data;

}


/* ================= SHUFFLE ================= */

function shuffle(array){

  const arr =
    [...(array || [])];

  for(
    let i=arr.length-1;
    i>0;
    i--
  ){

    const j =
      Math.floor(
        Math.random()*(i+1)
      );

    [
      arr[i],
      arr[j]
    ] =
    [
      arr[j],
      arr[i]
    ];

  }

  return arr;

}


/* ================= TITLE NORMALIZE ================= */

function normalizeSongTitle(title){

  return String(title || "")
    .toLowerCase()
    .replace(
      /\b(official|video|audio|lyrics?|lyric|4k|hd|full|status|shorts?|song|songs|music)\b/gi,
      " "
    )
    .replace(
      /[^\w\u0980-\u09FF]+/g,
      " "
    )
    .replace(
      /\s+/g,
      " "
    )
    .trim();

}


/* ================= SIMILARITY ================= */

function titleSimilarity(a,b){

  const A =
    new Set(
      normalizeSongTitle(a)
      .split(" ")
      .filter(
        x => x.length > 2
      )
    );

  const B =
    new Set(
      normalizeSongTitle(b)
      .split(" ")
      .filter(
        x => x.length > 2
      )
    );

  if(!A.size || !B.size)
    return 0;

  let common=0;

  A.forEach(x=>{

    if(B.has(x))
      common++;

  });

  return common /
    Math.min(
      A.size,
      B.size
    );

}


function isSameSong(title){

  return titleSimilarity(
    currentVideoTitle,
    title
  ) >= .75;

}


/* ================= FORMAT CARD ================= */

function videoCardHTML(item){

  const id =
    item.id?.videoId ||
    item.id;

  const snippet =
    item.snippet || {};

  if(!id)
    return "";

  const title =
    escapeHTML(
      snippet.title ||
      "Untitled"
    );

  const channel =
    escapeHTML(
      snippet.channelTitle ||
      "YouTube"
    );

  const thumb =
    snippet.thumbnails?.high?.url ||
    snippet.thumbnails?.medium?.url ||
    snippet.thumbnails?.default?.url ||
    "";

  const avatar =
    snippet.thumbnails?.default?.url ||
    thumb;

  return `

    <article
      class="video-card"
      data-video-id="${escapeHTML(id)}"
      data-title="${title}"
      data-thumb="${escapeHTML(thumb)}">

      <div class="thumb-wrap">

        <img
          src="${escapeHTML(thumb)}"
          alt="${title}"
          loading="lazy">

      </div>

      <div class="video-info">

        <img
          class="channel-avatar"
          src="${escapeHTML(avatar)}"
          alt=""
          loading="lazy">

        <div class="video-text">

          <div class="video-title">
            ${title}
          </div>

          <div class="video-meta">
            ${channel}
          </div>

        </div>

      </div>

    </article>

  `;

}


/* ================= RENDER HOME ================= */

function renderHome(items,append=false){

  if(!append)
    homeResults.innerHTML="";

  const valid =
    (items || [])
      .filter(
        item =>
          item.id?.videoId
      );

  homeResults.insertAdjacentHTML(
    "beforeend",
    valid.map(videoCardHTML).join("")
  );

}


/* ================= HOME SEARCH ================= */

async function searchHome(
  query,
  append=false
){

  query =
    String(query || "")
      .trim();

  if(!query)
    return;

  if(homeLoading)
    return;

  if(!append){

    homeNextPageToken="";
    homeResults.innerHTML =
      `<div class="loader">Searching...</div>`;

  }

  homeLoading=true;
  homeLoader.textContent =
    "Loading...";

  try{

    const data =
      await youtubeSearch(
        query,
        10,
        append
          ? homeNextPageToken
          : ""
      );

    if(!append)
      homeResults.innerHTML="";

    renderHome(
      data.items || [],
      true
    );

    homeCurrentQuery =
      query;

    homeNextPageToken =
      data.nextPageToken || "";

  }catch(error){

    if(!append){

      homeResults.innerHTML =
        `<div class="error">
          ${escapeHTML(error.message)}
        </div>`;

    }

  }finally{

    homeLoading=false;

    homeLoader.textContent =
      homeNextPageToken
        ? "Scroll for more..."
        : "";

  }

}


/* ================= MOOD ================= */

function getMoodKeyword(title){

  const t =
    String(title || "")
      .toLowerCase();

  if(
    /sad|kosto|কষ্ট|দুঃখ|broken|alone|pain|বিরহ/
      .test(t)
  )
    return "sad emotional";

  if(
    /love|romantic|romance|ভালোবাসা|প্রেম/
      .test(t)
  )
    return "romantic love";

  if(
    /lofi|chill|relax|লোফাই/
      .test(t)
  )
    return "lofi chill";

  if(
    /party|dance|dj|remix/
      .test(t)
  )
    return "party dance remix";

  if(
    /happy|fun|হ্যাপি/
      .test(t)
  )
    return "happy upbeat";

  if(
    /islamic|nasheed|হামদ|নাত|devotional/
      .test(t)
  )
    return "islamic nasheed";

  return (
    normalizeSongTitle(title) +
    " similar music"
  );

}


/* ================= RELATED CACHE ================= */

function relatedCacheKey(){

  return (
    "jawra_related_" +
    currentVideoId
  );

}


/* ================= LOAD RELATED ================= */

async function loadRelatedVideos(){

  if(!currentVideoId)
    return;

  const cacheKey =
    relatedCacheKey();

  try{

    const cached =
      sessionStorage.getItem(
        cacheKey
      );

    if(cached){

      const items =
        JSON.parse(cached);

      currentRelatedItems =
        shuffle(items);

      renderRelated(
        currentRelatedItems
      );

      return;

    }

  }catch(e){}


  relatedResults.innerHTML =
    `<div class="loader">
      Related music loading...
    </div>`;

  landscapeResults.innerHTML="";


  try{

    const mood =
      getMoodKeyword(
        currentVideoTitle
      );

    const variations =
      [
        "new",
        "latest",
        "mix",
        "hits",
        "playlist"
      ];

    const variation =
      variations[
        Math.floor(
          Math.random() *
          variations.length
        )
      ];

    const query =
      mood +
      " music " +
      variation;

    const data =
      await youtubeSearch(
        query,
        10
      );

    let items =
      (data.items || [])
      .filter(item=>{

        const id =
          item.id?.videoId;

        if(!id)
          return false;

        if(
          id ===
          currentVideoId
        )
          return false;

        if(
          isSameSong(
            item.snippet?.title || ""
          )
        )
          return false;

        return true;

      });

    items =
      shuffle(items)
      .slice(0,10);

    currentRelatedItems =
      items;

    try{

      sessionStorage.setItem(
        cacheKey,
        JSON.stringify(items)
      );

    }catch(e){}

    renderRelated(items);

  }catch(error){

    relatedResults.innerHTML =
      `<div class="error">
        Related music পাওয়া যায়নি.
        <br><br>
        ${escapeHTML(error.message)}
      </div>`;

  }

}


/* ================= RENDER RELATED ================= */

function renderRelated(items){

  relatedResults.innerHTML =
    (items || [])
      .map(videoCardHTML)
      .join("");

  renderLandscapeRelated(items);

}


/* ================= LANDSCAPE RELATED ================= */

function renderLandscapeRelated(items){

  landscapeResults.innerHTML =
    (items || [])
      .map(item=>{

        const id =
          item.id?.videoId;

        if(!id)
          return "";

        const title =

          item.snippet?.thumbnails?.default?.url ||

        return `

          <div

            data-video-id="${escapeHTML(id)}"
            data-title="${title}"
            data-thumb="${escapeHTML(thumb)}">

            <img
              src="${escapeHTML(thumb)}"
              alt="">

            <div>
              ${title}
            </div>

          </div>

        `;

      })
      .join("");

}


/* ================= OPEN PLAYER ================= */

function openPlayer(
  videoId,
  title,
  thumb
){

  if(!videoId)
    return;

  const fullscreen =
    !!(
      document.fullscreenElement ||
      document.webkitFullscreenElement
    );

  currentVideoId =
    videoId;

  currentVideoTitle =
    title ||
    "JAWRA MUSIC";

  currentVideoThumb =
    thumb ||
    "";

  playbackActive=true;


  /*
    IMPORTANT:
    Same iframe is reused.
    This prevents unnecessary reload.
  */

  if(
    youtubeFrame.dataset.videoId !==
    videoId
  ){

    youtubeFrame.src =
      "https://www.youtube-nocookie.com/embed/" +
      encodeURIComponent(videoId) +
      "?autoplay=1" +
      "&playsinline=1" +
      "&rel=0" +
      "&modestbranding=1" +
      "&enablejsapi=1" +
      "&origin=" +
      encodeURIComponent(
        location.origin
      );

    youtubeFrame.dataset.videoId =
      videoId;

  }


  playerPage.classList.remove(
    "mini-hidden"
  );

  playerPage.style.display =
    "block";

  app.style.display =
    "none";

  miniPlayer.style.display =
    "none";

  isMiniMode=false;

  playerSearchPanel.style.display =
    "none";

  requestWakeLock();


  if(!fullscreen){

    window.scrollTo({
      top:0,
      behavior:"instant"
    });

  }


  loadRelatedVideos();

}


/* ================= MINI MODE ================= */

function enterMiniMode(){

  if(!currentVideoId)
    return;

  exitVideoFullscreen();

  playbackActive=true;

  isMiniMode=true;


  /*
    DO NOT remove iframe.
    DO NOT change iframe src.
  */

  playerPage.classList.add(
    "mini-hidden"
  );

  app.style.display =
    "block";

  miniPlayer.style.display =
    "flex";

  miniTitle.textContent =
    currentVideoTitle;

  miniThumb.src =
    currentVideoThumb ||
    "";

  requestWakeLock();

}


/* ================= MINI OPEN ================= */

function reopenMiniPlayer(){

  if(!currentVideoId)
    return;

  playerPage.classList.remove(
    "mini-hidden"
  );

  playerPage.style.display =
    "block";

  app.style.display =
    "none";

  miniPlayer.style.display =
    "none";

  isMiniMode=false;

  requestWakeLock();

}


/* ================= CLOSE PLAYBACK ================= */

function closePlayback(){

  exitVideoFullscreen();

  playbackActive=false;

  isMiniMode=false;

  try{

    youtubeFrame.src="";

  }catch(e){}

  youtubeFrame.dataset.videoId="";

  currentVideoId="";
  currentVideoTitle="";
  currentVideoThumb="";

  currentRelatedItems=[];

  playerPage.classList.remove(
    "mini-hidden"
  );

  playerPage.style.display =
    "none";

  miniPlayer.style.display =
    "none";

  app.style.display =
    "block";

  releaseWakeLock();

}


/* ================= PLAYER SEARCH ================= */

function openPlayerSearch(){

  if(
    playerSearchPanel.style.display ===
    "block"
  ){

    playerSearchPanel.style.display =
      "none";

    return;

  }

  playerSearchPanel.style.display =
    "block";

  setTimeout(()=>{

    playerSearchInput.focus();

  },100);

}


/*
  When searching from Player:
  current video becomes Mini Player,
  then new results appear on Home.
*/

async function searchFromPlayer(){

  const query =
    playerSearchInput.value.trim();

  if(!query)
    return;

  /*
    Save current video before mini mode.
  */

  if(currentVideoId){

    enterMiniMode();

  }

  playerSearchPanel.style.display =
    "none";

  homeSearchInput.value =
    query;

  await searchHome(
    query,
    false
  );

}


/* ================= VOICE SEARCH ================= */

function startVoiceSearch(){

  const SpeechRecognition =
    window.SpeechRecognition ||
    window.webkitSpeechRecognition;

  if(!SpeechRecognition){

    alert(
      "তোমার browser-এ Voice Search support নেই। Chrome ব্যবহার করে চেষ্টা করো।"
    );

    return;

  }


  /*
    If already listening,
    stop it.
  */

  if(recognition){

    try{
      recognition.stop();
    }catch(e){}

    recognition=null;

    homeVoiceBtn.classList.remove(
      "listening"
    );

    return;

  }


  recognition =
    new SpeechRecognition();

  recognition.lang =
    "bn-BD";

  recognition.interimResults =
    false;

  recognition.continuous =
    false;

  recognition.maxAlternatives =
    1;


  recognition.onstart = ()=>{

    homeVoiceBtn.classList.add(
      "listening"
    );

    homeSearchInput.placeholder =
      "বলুন...";

  };


  recognition.onresult =
    async event=>{

      const text =
        event.results?.[0]?.[0]?.transcript ||
        "";

      if(text){

        homeSearchInput.value =
          text;

        await searchHome(
          text,
          false
        );

      }

    };


  recognition.onerror =
    event=>{

      console.log(
        "Voice error:",
        event.error
      );

    };


  recognition.onend =
    ()=>{

      homeVoiceBtn.classList.remove(
        "listening"
      );

      homeSearchInput.placeholder =
        "Search music...";

      recognition=null;

    };


  try{

    recognition.start();

  }catch(error){

    console.log(error);

  }

}


/* ================= FULLSCREEN ================= */

async function enterVideoFullscreen(){

  try{

    if(
      document.fullscreenElement ||
      document.webkitFullscreenElement
    )
      return;


    if(
      fullFrameHost.requestFullscreen
    ){

      try{

        await fullFrameHost.requestFullscreen({
          navigationUI:"hide"
        });

      }catch(e){

        await fullFrameHost.requestFullscreen();

      }

    }else if(
      fullFrameHost.webkitRequestFullscreen
    ){

      fullFrameHost.webkitRequestFullscreen();

    }


    if(
      screen.orientation &&
      screen.orientation.lock
    ){

      try{

        await screen.orientation.lock(
          "landscape"
        );

      }catch(e){}

    }

    playerRotateBtn.textContent =
      "↙";

  }catch(error){

    console.log(
      "Fullscreen error:",
      error
    );

  }

}


async function exitVideoFullscreen(){

  try{

    if(
      document.fullscreenElement &&
      document.exitFullscreen
    ){

      await document.exitFullscreen();

    }else if(
      document.webkitFullscreenElement &&
      document.webkitExitFullscreen
    ){

      document.webkitExitFullscreen();

    }

  }catch(e){}


  try{

    if(
      screen.orientation &&
      screen.orientation.unlock
    ){

      screen.orientation.unlock();

    }

  }catch(e){}

  playerRotateBtn.textContent =
    "⛶";

}


/* ================= WAKE LOCK ================= */

async function requestWakeLock(){

  if(
    !("wakeLock" in navigator)
  )
    return;

  try{

    if(wakeLock)
      return;

    wakeLock =
      await navigator.wakeLock.request(
        "screen"
      );

    wakeLock.addEventListener(
      "release",
      ()=>{
        wakeLock=null;
      }
    );

  }catch(e){

    console.log(
      "WakeLock:",
      e
    );

  }

}


async function releaseWakeLock(){

  if(!wakeLock)
    return;

  try{

    await wakeLock.release();

  }catch(e){}

  wakeLock=null;

}
